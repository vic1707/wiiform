name: Wiiform checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A release tag must be v<version> of wiiform-cli, the version the binaries report.
      - name: Check a release tag against the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' wiiform-cli/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match wiiform-cli/Cargo.toml version $version"
            exit 1
          fi
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.4
      - name: Install Qt on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential qtbase5-dev qt5-qmake
          echo "QT_ROOT_DIR=/usr" >> "$GITHUB_ENV"
      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        run: brew install qt@5
      - run: mise run test

  # Each image runs its command's --version while it builds, which is the smoke test.
  # Runs only when every test leg passed, so a failing test publishes nothing.
  images:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      # Pull request names are not valid tags; only published builds use the ref name.
      TAG: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) && github.ref_name || 'ci' }}-${{ matrix.arch }}
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          source: .
          push: ${{ env.PUBLISH == 'true' }}

  # Joins the two architectures of each image under one tag: the branch or
  # release tag name, and for a release also `latest`.
  manifests:
    needs: images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for image in wiiform wii-seed wii-nand; do
            tags=(-t "$REGISTRY/$image:$TAG")
            if [ "$RELEASE" = true ]; then
              tags+=(-t "$REGISTRY/$image:latest")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "$REGISTRY/$image:$TAG-amd64" "$REGISTRY/$image:$TAG-arm64"
          done
