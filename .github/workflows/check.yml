name: Wiiform checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          version: 2026.11.4
      - name: Install Qt on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential qtbase5-dev qt5-qmake
          echo "QT_ROOT_DIR=/usr" >> "$GITHUB_ENV"
      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        run: brew install qt@5
      - run: mise run test

  # Each image runs its command's --version while it builds, which is the smoke test.
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      # Branch and pull request names are not valid tags; only published builds use the ref name.
      TAG: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) && github.ref_name || 'ci' }}-${{ matrix.arch }}
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v6
        with:
          source: .
          push: ${{ env.PUBLISH == 'true' }}

  # Joins the two architectures of each image under one tag.
  manifests:
    needs: images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for image in wiiform wii-seed wii-nand; do
            docker buildx imagetools create -t "$REGISTRY/$image:$TAG" \
              "$REGISTRY/$image:$TAG-amd64" "$REGISTRY/$image:$TAG-arm64"
          done
