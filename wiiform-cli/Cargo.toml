[package]
name = "wiiform"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
wiiform-recipe = { path = "recipe", features = ["cli"] }
anyhow.workspace = true
clap.workspace = true
cxx = "=1.0.205"
rustix = { version = "1.1.6", features = ["fs", "process"] }
lzma-rust2 = { version = "=0.25.0", features = ["std"] }
serde.workspace = true
serde-saphyr.workspace = true
tempfile = "3"

[dev-dependencies]
sha2 = "0.11"

[build-dependencies]
cxx-build = "=1.0.205"

[lints]
workspace = true
