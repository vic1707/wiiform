[package]
name = "wiiform"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
wiiform-recipe = { path = "recipe" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
cxx = "=1.0.205"
libc = "0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "0.11"
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[build-dependencies]
cxx-build = "=1.0.205"

[lints]
workspace = true
