[package]
name = "wiiform-recipe"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[features]
default = []
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
nnn = { version = "=1.2.6", features = ["regex_validation"] }
regex = "1"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = "=2.1.1"
sha2 = "0.11"

[lints]
workspace = true
