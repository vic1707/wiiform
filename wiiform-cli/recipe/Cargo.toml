[package]
name = "wiiform-recipe"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[features]
default = []
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
libc = "0.2"
hex = { version = "0.4.3", features = ["serde"] }
clap = { version = "4.6", features = ["derive"], optional = true }
nnn = "=1.2.7"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = "=2.1.1"
unicode-general-category = "1.1"

[lints]
workspace = true
