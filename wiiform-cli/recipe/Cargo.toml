[package]
name = "wiiform-recipe"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[features]
default = []
cli = ["dep:clap"]

[dependencies]
anyhow.workspace = true
base64 = "0.23"
libc = "0.2"
hex = { version = "0.4.3", features = ["serde"] }
clap = { workspace = true, optional = true }
nnn = "=1.2.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
schemars = "=1.2.3"
semver = { version = "1.0", features = ["serde"] }
serde.workspace = true
serde_json = "=1.0.154"
serde-saphyr.workspace = true
sha2 = "0.11"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
derive_more = { version = "2.1", default-features = false, features = ["display", "deref", "as_ref", "into", "debug"] }

[lints]
workspace = true
