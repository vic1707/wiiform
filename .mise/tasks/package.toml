[package]
description = "Build a relocatable archive for this platform"
depends = ["build", "schema:check"]
run = '''
set -eu
case "$(uname -s)-$(uname -m)" in
    Darwin-arm64) platform=macos-arm64; extension=dylib ;;
    Linux-x86_64) platform=linux-x86_64; extension=so ;;
    *) echo "Wiiform packages macOS arm64 and Linux x86_64" >&2; exit 1 ;;
esac
version=$(awk -F '"' '/^version = / { print $2; exit }' wiiform-cli/Cargo.toml)
bundle="wiiform-$version-$platform"
output="${WIIFORM_DIST_DIR:-dist}"
mkdir -p "$output"
scratch=$(mktemp -d "$output/.package.XXXXXX")
trap 'rm -rf "$scratch"' EXIT
stage="$scratch/$bundle"
archive="$bundle.tar.gz"
if [ -e "$output/$archive" ] || [ -e "$output/$archive.sha256" ]; then
    echo "Archive already exists at $output/$archive" >&2
    exit 1
fi

set -- build/bin/wiiform=bin/wiiform build/bin/wii-seed=bin/wii-seed \
       build/bin/wii-nand=bin/wii-nand "build/lib/libwiiform-core.$extension=lib/libwiiform-core.$extension"
case "$platform" in
    macos-arm64)
        python3 .mise/tasks/.package/macos.py --output "$stage" \
            "--artifact=$1" "--artifact=$2" "--artifact=$3" "--artifact=$4" ;;
    linux-x86_64)
        bash .mise/tasks/.package/linux.sh "$stage" "$@" ;;
esac

cp LICENSE THIRD_PARTY.md README.md "$stage/"
cp -R docs "$stage/"
mkdir "$stage/include"
cp -R src-wiiformlib/include/wiiform "$stage/include/"
tar -C "$scratch" -czf "$scratch/$archive" "$bundle"
(cd "$scratch" && shasum -a 256 "$archive" > "$archive.sha256")
mv "$scratch/$archive" "$scratch/$archive.sha256" "$output/"
printf '%s\n' "$output/$archive" "$output/$archive.sha256"
'''
