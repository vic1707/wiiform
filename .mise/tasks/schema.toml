[schema]
description = "Regenerate the JSON Schema from the Rust recipe model"
run = '''
set -eu
output=$(mktemp docs/.recipe-schema.XXXXXX)
trap 'rm -f "$output"' EXIT
cargo run --quiet --locked -p wiiform-recipe --example recipe-schema > "$output"
chmod 644 "$output"
mv "$output" docs/wiiform.recipe.schema.json
'''

["schema:check"]
description = "Check the documented schema against the Rust recipe model"
run = '''
set -eu
output=$(mktemp)
trap 'rm -f "$output"' EXIT
cargo run --quiet --locked -p wiiform-recipe --example recipe-schema > "$output"
diff -u docs/wiiform.recipe.schema.json "$output"
'''
