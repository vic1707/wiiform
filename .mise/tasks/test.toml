[test]
description = "Run the Rust and C++ regression suites and check the schema"
depends = ["test:rust", "test:native", "schema:check"]

["test:fixtures"]
description = "Build the synthetic NAND fixture and regression executable"
depends = ["native:build"]
env = { TMPDIR = "{{ config_root }}/build/tmp" }
run = "xmake build -y -j2 nand-buffer-regressions"

["test:rust"]
description = "Run Rust formatting, Clippy, and tests"
depends = ["build", "test:fixtures"]
env = { LD_LIBRARY_PATH = "{{ config_root }}/build/lib", DYLD_LIBRARY_PATH = "{{ config_root }}/build/lib", WIIFORM_TEST_FIXTURE_BUILDER = "{{ config_root }}/build/bin/nand-buffer-regressions" }
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --release --workspace --all-targets",
  "cargo test --locked --release --workspace",
]

["test:native"]
description = "Run synthetic NAND buffer regressions"
depends = ["test:fixtures"]
env = { TMPDIR = "{{ config_root }}/build/tmp" }
run = [
  "xmake build -y -j2 nand-buffer-tests",
  "build/bin/nand-buffer-tests",
  "xmake build -y -j2 sysconf-generated-tests",
  "build/bin/sysconf-generated-tests",
  "build/bin/nand-buffer-regressions",
]
