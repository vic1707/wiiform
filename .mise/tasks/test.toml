[test]
description = "Run the Rust and C++ regression suites and check the schema"
depends = ["test:rust", "test:native", "schema:check"]

["test:rust"]
description = "Run Rust formatting, Clippy, and tests"
depends = ["build"]
env = { LD_LIBRARY_PATH = "{{ config_root }}/build/lib", DYLD_LIBRARY_PATH = "{{ config_root }}/build/lib" }
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --release --workspace --all-targets",
  "cargo test --locked --release --workspace",
]

["test:native"]
description = "Run synthetic tests against the C++ library and installed Rust commands"
depends = ["build"]
env = { TMPDIR = "{{ config_root }}/build/tmp" }
run = '''
set -eu
for suite in install inventory preflight remove roundtrip sysconf wad backupmii_footer public-api; do
    xmake build -y -j2 "$suite-tests"
    case "$suite" in
        inventory) build/bin/inventory-tests build/bin/wii-nand ;;
        roundtrip) build/bin/roundtrip-tests build/bin/wii-seed ;;
        *) "build/bin/$suite-tests" ;;
    esac
done
'''
