# yaml-language-server: $schema=https://raw.githubusercontent.com/vic1707/wiiform/main/docs/wiiform.recipe.schema.json
# Template only: replace the sample WAD path and hash with real values.
# The NAND image: every key below sits under nand.
nand:
  menu: 4.3E

  # Stock channels to remove. Names expand to the menu region's title IDs.
  remove:
    - forecast-channel
    - news-channel
    # - wii-shop-channel
    # - photo-channel

  # A setup mapping completes first-run setup. language and country are
  # required; the other keys default to a factory-fresh Wii's values.
  # Omit setup or set it to null to run the Wii setup wizard.
  setup:
    nickname: "Speed Wii" # Defaults to "Wii".
    language: en # E: en/de/fr/es/it/nl; U: en/fr/es; J: ja.
    country: GB # Two-letter code of a country in the menu's region. Quote "NO".
    sensor_bar: above # above or below; defaults to above.
    display:
      aspect: "16:9" # Defaults to "4:3".
      progressive: true # Enables 480p where supported, off by default. fix_480p is a separate hack.
      pal60: false # Off by default.

  # Titles to install, by kind. Paths are relative to this file.
  titles:
    # Channels, VC and WiiWare titles and app channels, as WADs: path, url,
    # inline, or github: {repo, tag, asset}, with the SHA-256 of the raw WAD.
    channels:
      - path: wads/example-pal-channel.wad
        sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        allow_unsigned: false # true permits an unsigned community channel WAD
      # - url: "https://example.com/channel.wad"
      #   sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    # Nintendo IOS, downloaded from NUS. Stock 4.3 already has every IOS it ships,
    # such as IOS9 v1034: listing one only verifies it.
    # ios:
    #   - {slot: 9, version: 1034}
    # d2x cIOS, built from a d2x release on its base IOS from NUS, or prebuilt WADs.
    # cios:
    #   - d2x:
    #       github: {repo: wiidev/d2x-cios, tag: d2x-v11-beta3, asset: d2x-v11-beta3.zip}
    #       sha256: "c2c7c9c5dad247c48f561a2b08f74359227e09271104dec814dbab4ad97e68d3"
    #     target:
    #       slot: 249 # 248–251.
    #       base: 56 # 38, 56, 57, or 58.
    #       revision: 65535 # TMD revision of the cIOS.
    #       replace_stock_stub: true # Allows replacing the verified 249/250 v65280 stub.
    #   - path: wads/d2x-wii-250-base57.wad # A prebuilt cIOS WAD instead.
    #     sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    #     target: {slot: 250, base: 57, revision: 65535}

  # Optional BootMii as IOS (IOS254), taken from the seed. Its SD files
  # (/bootmii/armboot.bin and ppcboot.elf) go under sd.
  # bootmii: {}

  # Optional Homebrew Channel, installed before Priiloader.
  # hbc:
  #   reborn:
  #     version: "1.16.0" # Semver of a release with a retail OHBC WAD.
  #     # sha256 is optional. Wiiform uses the GitHub asset digest by default.
  #
  # A custom HBC WAD requires its SHA-256.
  # hbc:
  #   custom:
  #     path: wads/my-homebrew-channel.wad # Also accepts url or inline as above.
  #     sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # Optional RVLoader, installed as its Wii-side installer does. Requires priiloader
  # without its autoboot and return_to keys.
  # rvloader:
  #   version: "2.1"
  #   sha256: "30be3599e13f91bba0d5060a316d13bb428ea4d71ba7b35ebe89682cdedd94d7" # installer/data/bootloader.dol of that release.
  #   wd_sha256: "6b7f6c95ec886899b43dcb5ca3dc15e20bbaa7c8c4e617e21166876f01cdb7b8" # installer/data/wd.bin of that release.
  #   patch_out_wifi: false # Also remove the Wi-Fi modules from IOS36, IOS58 and IOS80.
  #   vga: false # Requires setup.display.progressive, and pal60 on 4.3E.

  priiloader: # An empty mapping installs Priiloader with pinned defaults.
    # Every Priiloader setting and hack state is written. Omitted keys use the
    # pinned 0.10.0 defaults; prior NAND values are not preserved.
    autoboot: system_menu # disabled/homebrew_channel/bootmii_ios/system_menu/file
    return_to: system_menu # system_menu/priiloader/autoboot/file
    shutdown_to: none # none/priiloader/autoboot
    preferred_mount_point: auto # auto/sd/usb
    stop_disc: false
    lid_slot_on_error: false
    ignore_shutdown_mode: false
    white_background: false
    dump_gecko_text: false
    show_rc_updates: false
    # Hacks to enable; every hack not listed is disabled. With the schema, an
    # editor shows what each does when hovering `hacks`.
    hacks:
      - fix_480p
      # - block_online_updates
      # - block_disc_updates
      # - block_disc_autoboot
      # - auto_press_a
      # - remove_deflicker
      # - move_disc_channel
      # - remove_nocopy_save_protection
      # - replace_health_screen
      # - no_background_music
      # - wiimmfi
      # - region_free_everything # Japanese menus use the pinned JP definition.
      # - no_sfx_and_background_music # Excludes no_background_music.
      # - re_enable_bannerbomb
      # - usb_gecko_report
      # - usb_gecko_report_geckoos # Excludes usb_gecko_report.
      # - force_data_management
      # - force_recovery_mode
      # - remove_diagnostic_disc_check
      # - no_delete_homebrew
      # - force_disc_ios248 # The four force_disc_ios hacks exclude each other.
      # - force_disc_ios249
      # - force_disc_ios250
      # - force_disc_ios251
      # - unblock_service_discs
      # - remove_ios16_disc_error
      # - mark_network_tested

# Files for the SD card, published in sd/ next to nand.bin and keys.bin. Every
# file takes one source (path, url, inline, or github: {repo, tag, asset}) and a
# sha256, which a GitHub release asset may omit when its release states one.
sd:
  apps: # Each key is the card folder apps/<key>/.
    Example: # From an archive, its folder holding boot.dol or boot.elf becomes apps/Example/.
      path: sd/example-app.zip
      sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    # usbloader_gx:
    #   github: {repo: wiidev/usbloadergx, tag: v4.0-r1283, asset: usbloadergx_r1283.zip}
    # Nintendont: # Loose files instead of an archive.
    #   files:
    #     boot.dol: {url: "https://example.com/loader.dol", sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}
  # bundles: # Anything else, placed from the card's root.
  #   - github: {repo: Fledge68/WiiFlow_Lite, tag: v5.6.2, asset: wiiflow_v5.6.2.zip}
  #     unzip: / # The whole archive.
  #   - path: covers.zip
  #     sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  #     extract: {"**/*.png": /rvloader/covers/} # Glob -> directory; unmatched files stay out.

# Files for a USB drive, published in usb/. Same shape as sd.
# usb:
#   bundles:
#     - github: {repo: Aurelio92/RVLoader, tag: v2.1, asset: RVLoader_v2.1.zip}
#       sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
#       extract: # The RVLoader app and its data, without the bundled BBLoader and Nintendont.
#         "RVLoader_v2.1/apps/RVLoader/**": /apps/RVLoader/
#         "RVLoader_v2.1/rvloader/**": /rvloader/
