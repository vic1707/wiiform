[configure]
description = "Configure xmake; set QT_ROOT_DIR when it cannot find Qt by itself"
run = 'xmake f -y -m release ${QT_ROOT_DIR:+--qt="$QT_ROOT_DIR"}'

["build:native"]
description = "Build the C++ library into build/lib"
depends = ["configure"]
run = 'xmake build -y ${WIIFORM_BUILD_JOBS:+-j"$WIIFORM_BUILD_JOBS"} wiiform-core'

[build]
description = "Build the library and the three commands into build/bin"
depends = ["build:native"]
run = [
  "cargo build --locked --release -p wiiform --bins",
  "mkdir -p build/bin",
  "cp build/cargo/release/wiiform build/cargo/release/wii-seed build/cargo/release/wii-nand build/bin/",
]

[wiiform]
description = "Build and run wiiform"
depends = ["build"]
run = "build/bin/wiiform"

[wii-seed]
description = "Build and run wii-seed"
depends = ["build"]
run = "build/bin/wii-seed"

[wii-nand]
description = "Build and run wii-nand"
depends = ["build"]
run = "build/bin/wii-nand"

["test:native"]
description = "Build and run the C++ tests"
depends = ["configure"]
run = "xmake test -y"

["test:rust"]
description = "Check formatting, lint, and run the Rust tests (which also check the schema)"
depends = ["build:native", "test:native"]
env = { LD_LIBRARY_PATH = "{{ config_root }}/build/lib", DYLD_LIBRARY_PATH = "{{ config_root }}/build/lib", WIIFORM_TEST_FIXTURE_BUILDER = "{{ config_root }}/build/bin/nand-buffer-regressions" }
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --release --workspace --all-targets",
  "cargo test --locked --release --workspace",
]

[test]
description = "Run every check"
depends = ["test:native", "test:rust"]

[schema]
description = "Rewrite docs/wiiform.recipe.schema.json from the recipe types"
env = { UPDATE_SCHEMA = "1" }
run = "cargo test --locked -p wiiform-recipe committed_schema"

[image]
description = "Build the three container images"
run = "docker buildx bake"
