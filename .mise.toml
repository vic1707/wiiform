[tools]
cmake = "3.31.8"
rust = "1.99.0"

[tools."github:xmake-io/xmake"]
# 3.1.2's macOS ARM bundle fails at startup with a missing core script.
version = "3.1.1"
bin = "xmake"

[tools."github:xmake-io/xmake".platforms]
linux-arm64 = { asset_pattern = "xmake-bundle-v*.cosmocc", format = "raw" }
linux-x64 = { asset_pattern = "xmake-bundle-v*.linux.x86_64", format = "raw" }

[env]
CARGO_TARGET_DIR = "{{ config_root }}/build/cargo"

[task_config]
includes = ["mise-tasks.toml"]
